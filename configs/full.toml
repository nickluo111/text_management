# Complete full-corpus configuration. This file is standalone; it does not
# inherit from default.toml.

[runtime]
mode = "real"

[data]
business_path = "data/raw/yelp_academic_dataset_business.json"
review_path = "data/raw/yelp_academic_dataset_review.json"
prepared_path = "data/processed/reviews-full.jsonl"
sample_path = "data/processed/reviews-sample.jsonl"
random_seed = 42

[tokenizer]
lowercase = true
preserve_contractions = true
preserve_emojis = true
split_hyphenated_words = true
vocabulary_path = "data/processed/vocabulary-analysis_full.sqlite" #11.1 change

[index]
output_dir = "artifacts/indexes/full"

[search]
top_k = 10

[search.bm25]
k1 = 1.5
b = 0.75

[analysis.heaps] # 11. 1 change
sample_fractions = [0.10, 0.30, 0.50, 1.00]
seed = 2026
keep_random_order = false
enhanced_output_dir = "artifacts/corpus_enhanced/analysis_full/heaps"

[analysis.zipf] # 11.1 change
enhanced_output_dir = "artifacts/corpus_enhanced/analysis_full/zipf"

[trends]
sector_a = "Italian Restaurants"
sector_b = "Fast Food"
time_granularity = "year"

[trends.pmi]
target_term = "service"
window_size = 5
top_n = 20
min_cooccurrence = 10
