# Complete sampled-data configuration. Generate reviews-sample.jsonl with the
# full config first, then use this file for downstream development commands.

[runtime]
mode = "real"

[data]
business_path = "data/raw/yelp_academic_dataset_business.json"
review_path = "data/raw/yelp_academic_dataset_review.json"
prepared_path = "data/processed/reviews-sample.jsonl"
sample_path = "data/processed/reviews-sample.jsonl"
random_seed = 42

[tokenizer]
lowercase = true
preserve_contractions = true
preserve_emojis = true
split_hyphenated_words = true
vocabulary_path = "data/processed/vocabulary-full.sqlite"

[index]
output_dir = "artifacts/indexes/sample"

[search]
top_k = 10

[search.bm25]
k1 = 1.5
b = 0.75

[analysis.search]
expected_documents = 50000
queries = [
  "good service",
  "cheap Italian restaurant",
  "family friendly atmosphere",
  "slow delivery",
  "best coffee and breakfast",
  "not worth the price",
]
output_dir = "artifacts/search_engine/sample"
manifest_path = "artifacts/search_engine/sample/run_manifest.json"
repeats = 1

[analysis.zipf]
output_dir = "artifacts/zipf/sample"

[analysis.heaps]
sample_fractions = [0.10, 0.30, 0.50, 1.00]
seed = 2026
output_dir = "artifacts/heaps/sample"
keep_random_order = false

[analysis.tokenizers]
sample_size = 50000
seed = 42
benchmark_reviews = 500
benchmark_repeats = 5
output_dir = "artifacts/tokenizer_comparison/sample"

[trends.sentiment]
time_granularity = "year"
confidence_level = 0.95
output_dir = "artifacts/sentiment/sample"

[[trends.sentiment.sectors]]
name = "Italian Restaurants"
categories = ["Italian", "Restaurants"]

[[trends.sentiment.sectors]]
name = "Fast Food"
categories = ["Fast Food"]

[trends.pmi]
target_term = "service"
window_size = 5
top_n = 20
min_cooccurrence = 10
min_cooccurrence_rate = 0.001
time_granularity = "year"
output_dir = "artifacts/pmi/sample"
