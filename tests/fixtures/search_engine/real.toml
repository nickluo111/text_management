# Same tiny corpus, using the real shared review reader and tokenizer pipeline.
# Requires installed project dependencies and NLTK stopwords.
[runtime]
mode = "real"

[data]
prepared_path = "tests/fixtures/search_engine/reviews.jsonl"

[tokenizer]
skip_types = ["punctuation"]
enable_pos = false

[index]
output_dir = "artifacts/indexes/fixture-real"

[search]
top_k = 10

[search.bm25]
k1 = 1.5
b = 0.75

