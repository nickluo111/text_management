[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yelptext"
version = "0.1.0"
description = "AI6122 Yelp review text analysis, retrieval, and trend analysis"
readme = "README.md"
requires-python = "==3.12.4"
dependencies = [
    "numpy==2.4.4",
    "scipy==1.17.1",
    "pandas==3.0.2",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    "nltk==3.8.1",
    "regex==2026.9.29",
    "tqdm==4.66.4",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab==4.0.11",
    "ipykernel==6.28.0",
]
dev = [
    "pytest==7.4.4",
]

[project.scripts]
yelptext = "yelptext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
