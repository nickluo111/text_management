[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yelptext"
version = "0.1.0"
description = "AI6122 Yelp review text analysis, retrieval, and trend analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
yelptext = "yelptext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
